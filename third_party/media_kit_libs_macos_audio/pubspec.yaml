name: media_kit_libs_macos_audio
description: Navis copy of media_kit_libs_macos_audio that bundles Navis's own audio-only LGPL libmpv (equalizer filters, SecureTransport TLS).
version: 1.1.4+navis.1
publish_to: none
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MediaKitLibsMacosAudioPlugin
