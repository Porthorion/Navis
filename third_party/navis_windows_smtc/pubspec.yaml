name: navis_windows_smtc
description: Navis-owned Windows System Media Transport Controls bridge.
version: 1.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  flutter_rust_bridge: 2.13.0
  plugin_platform_interface: ^2.1.8
  meta: ^1.19.0
  uuid: ^4.6.0

dev_dependencies:
  ffigen: ^22.0.0
  lints: ^6.1.0
  test: ^1.31.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
