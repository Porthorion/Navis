name: navis
description: "Navis — a Subsonic/OpenSubsonic music player for Android, iOS, macOS, Linux, and Windows."
publish_to: 'none'

version: 1.4.0+10400

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"

dependencies:
  android_file_picker: ^1.0.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^3.4.1
  colornames: ^0.2.0
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^17.5.0
  intl: ^0.20.3
  # Vendored: adds native parametric EQ without changing the playback engine.
  just_audio:
    path: third_party/just_audio
  logger: ^2.7.0
  meta: ^1.19.0
  octo_image: ^2.1.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  rxdart: ^0.28.0
  scrollable_positioned_list: ^0.3.8
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  visibility_detector: ^0.4.0+2
  dbus: ^0.7.15
  # Vendored: enables libmpv force-seekable for Subsonic progressive streams.
  just_audio_media_kit:
    path: third_party/just_audio_media_kit
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  navis_windows_smtc:
    path: third_party/navis_windows_smtc
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  media_kit_libs_macos_audio: ^1.1.4

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  file: ^7.0.1
  freezed: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod: ^3.4.2
  url_launcher_platform_interface: ^2.3.2
  very_good_analysis: ^10.3.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  just_audio_platform_interface:
    path: third_party/just_audio_platform_interface

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/autoeq/
    - lib/src/icon/Navis_App_Icon.png
    - lib/src/icon/Navis_Logo.svg
