name: navis
description: "Navis — a Subsonic/OpenSubsonic music player for Android and iOS."
publish_to: 'none'

version: 0.6.4+604

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  dio: ^5.9.2
  drift: ^2.31.0
  drift_flutter: ^0.2.5
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.2.1
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  go_router: ^17.1.0
  intl: ^0.20.2
  just_audio: ^0.10.5
  logger: ^2.6.2
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.12.2
  #custom_lint: ^0.8.1 # temporarily disabled — analyzer ^8.0.0 conflicts with riverpod_lint 3.1+
  drift_dev: ^2.31.0
  freezed: ^3.2.3
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.2
  mocktail: ^1.0.4
  riverpod_lint: ^3.1.3
  very_good_analysis: ^10.2.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/src/icon/Navis_Icon_dark.png
    - lib/src/icon/Navis_Icon_light.png
