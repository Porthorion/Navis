name: navis
description: "Navis — a Subsonic/OpenSubsonic music player for Android, iOS, macOS, Linux, and Windows."
publish_to: 'none'

version: 1.0.12+10012

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  cached_network_image: ^3.4.1
  colornames: ^0.2.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7
  dio: ^5.9.2
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  file_picker: ^12.0.0-beta.7
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.16
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^17.1.0
  intl: ^0.20.2
  just_audio: ^0.10.5
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  visibility_detector: ^0.4.0+2
  audio_service_mpris: ^0.2.1
  dbus: ^0.7.10
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  smtc_windows: ^1.1.0
  window_manager: ^0.5.1
  media_kit_libs_macos_audio: ^1.1.4

dev_dependencies:
  build_runner: ^2.13.1
  #custom_lint: ^0.8.1 # temporarily disabled — analyzer ^8.0.0 conflicts with riverpod_lint 3.1+
  drift_dev: ^2.32.1
  freezed: ^3.2.5
  flutter_test:
    sdk: flutter
  json_serializable: ^6.13.1
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/src/icon/Navis_App_Icon.png
    - lib/src/icon/Navis_Icon_Dark.png
    - lib/src/icon/Navis_Icon_light.png
    - lib/src/icon/Navis_Icon_Dark.svg
    - lib/src/icon/Navis_Icon_Light.svg
