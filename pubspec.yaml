name: navis
description: "Navis — a Subsonic/OpenSubsonic music player for Android, iOS, macOS, Linux, and Windows."
publish_to: 'none'

version: 1.5.2+10502

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

dependencies:
  navis_android_storage:
    path: third_party/navis_android_storage
  android_file_picker: ^2.2.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.7
  cupertino_ui: ^1.1.7
  cupertino_icons: ^2.0.0
  connectivity_plus: ^7.3.1
  convert: ^3.1.2
  crypto: ^3.0.8
  dio: ^5.11.1
  drift: ^2.35.4
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.5.0
  flutter_local_notifications: ^23.0.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  # Vendored: adds native parametric EQ without changing the playback engine.
  just_audio:
    path: third_party/just_audio
  logger: ^2.8.0
  logging: ^1.3.0
  material_color_utilities: ^0.13.0
  material_ui: ^1.11.1
  meta: ^1.19.0
  octo_image: ^2.1.5
  package_info_plus: ^10.2.2
  file: ^7.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  path_provider_platform_interface: ^2.1.3
  rxdart: ^0.28.0
  scrollable_positioned_list: ^0.3.8
  sqflite: ^2.4.6
  sqlite3: ^3.9.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  visibility_detector: ^0.4.0+2
  dbus: ^0.7.15
  # Vendored: enables libmpv force-seekable for Subsonic progressive streams.
  just_audio_media_kit:
    path: third_party/just_audio_media_kit
  # Vendored to bundle a pinned full libmpv (see the package's NAVIS.md).
  media_kit_libs_windows_audio:
    path: third_party/media_kit_libs_windows_audio
  media_kit_libs_linux: ^1.2.1
  navis_windows_smtc:
    path: third_party/navis_windows_smtc
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  # Vendored to bundle Navis's own LGPL libmpv (see the package's NAVIS.md).
  media_kit_libs_macos_audio:
    path: third_party/media_kit_libs_macos_audio
  cryptography: ^2.9.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  freezed: ^4.0.3
  flutter_test:
    sdk: flutter
  # Not used by Navis's own analysis_options, but the root `flutter analyze`
  # resolves the vendored third_party/ packages' `include:` of it.
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
  flutter_launcher_icons: ^0.14.4

  media_kit: ^1.2.6
  fake_async: ^1.3.3
  sqflite_common_ffi: ^2.4.7
dependency_overrides:
  audio_service:
    path: third_party/audio_service
  just_audio_platform_interface:
    path: third_party/just_audio_platform_interface

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/licenses/
    - LICENSE
    - assets/autoeq/
    - assets/changelog/
    - lib/src/icon/Navis_App_Icon.png
    - lib/src/icon/Navis_Logo.svg
    - assets/fonts/OFL.txt

  # Inter variable font (SIL OFL 1.1): FontWeight maps onto its wght axis,
  # so one file covers every weight the type scale uses.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
