name: 🔌 Server compatibility problem
description: Navis doesn't work correctly with your Subsonic/OpenSubsonic server (sign-in fails, items missing, wrong data).
labels: [server-compatibility, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Before you file: read [CONTRIBUTING.md](https://github.com/Porthorion/Navis/blob/dev/CONTRIBUTING.md) and the [AI contributions policy](https://github.com/Porthorion/Navis/blob/dev/docs/development/ai-contributions.md). Reports with fabricated logs, steps or results lead to a block.
        Navis talks to many servers that implement the Subsonic or OpenSubsonic API slightly differently. This form collects what we need to reproduce your server's behaviour.
        Please **never** post your password, API tokens or a private server address.
  - type: input
    id: server
    attributes:
      label: Server software and exact version
      placeholder: "Navidrome 0.58.0 (Docker)  /  Gonic 0.16.4  /  LMS 3.60  /  Nextcloud Music 2.1"
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Sign-in method
      options:
        - Normal sign-in
        - Legacy authentication (Settings › Server)
        - Not sure
  - type: textarea
    id: problem
    attributes:
      label: What goes wrong?
      description: For example, sign-in error text, albums or playlists missing, wrong artwork, songs that won't play, or a sync that never finishes.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in to a fresh Gonic 0.16 server
        2. Open Library › Playlists
        3. Playlists created in the web UI are missing
    validations:
      required: true
  - type: textarea
    id: works_elsewhere
    attributes:
      label: Does it work in other clients?
      description: Does the same server work with the server's web UI or another Subsonic app? Which ones?
  - type: textarea
    id: details
    attributes:
      label: Library details that might matter
      description: Rough library size, unusual tags (multiple artists, classical, non-Latin text), file formats, or a reverse proxy in front of the server.
  - type: input
    id: version
    attributes:
      label: Navis version and platform
      placeholder: "1.5.0 on Android 15"
    validations:
      required: true
  - type: textarea
    id: technical_notes
    attributes:
      label: Technical notes
      description: Optional. A suspected cause, relevant files or AI analysis go here, kept separate from what you observed above.
  - type: input
    id: ai_harness
    attributes:
      label: AI harness
      description: The tool driving the model, e.g. Claude Code, Codex CLI, Cursor. Write "none" if no AI was used.
    validations:
      required: true
  - type: input
    id: ai_tools
    attributes:
      label: AI tool(s)
      description: Other AI-based tools used, or "none".
    validations:
      required: true
  - type: input
    id: ai_models
    attributes:
      label: AI model(s)
      description: The exact identifier your tool reports, or "n/a".
    validations:
      required: true
  - type: dropdown
    id: ai_involvement
    attributes:
      label: AI involvement
      options:
        - Fully AI-generated, human verified
        - AI-assisted
        - Human-written, AI-reviewed
        - No AI used
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed passwords, tokens and private server addresses from everything I attached.
          required: true
