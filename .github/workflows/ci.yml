name: CI

# Docs-only changes skip CI, so the maintainer merges them as admin.
on:
  pull_request:
    branches: [dev, main, 'release/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
  push:
    branches: [dev, 'release/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the base-without-harness self-check walks to the repository's root commit
      # The system Python on ubuntu-24.04 is externally managed (PEP 668): pip install is refused.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-numpy
      - run: python3 tool/playback_harness_test.py
      - run: python3 tool/validation_gate_test.py
      - run: for script in tool/*.sh tool/lib/*.sh; do bash -n "$script"; done

  # Format, committed generated code, analyze and dead-code gate.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 3.47.5 is the minimum and active 3.47.x baseline in tool/bootstrap.sh.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # The sqlite3 package's build hook downloads a prebuilt library on every
      # run; a cached copy avoids refetching it, including on GitHub outages.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build
          key: sqlite3-hook-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            sqlite3-hook-${{ runner.os }}-${{ github.job }}-

      # Local release/packaging and Python tooling stays in tool/check.sh.
      # Native JVM checks have their own Android SDK job below.
      - run: ./tool/bootstrap.sh
      - run: ./tool/dart_format.sh --check
      - run: dart run build_runner build
      # Generated files are committed; a diff here means they are stale.
      - run: git diff --exit-code -- '*.g.dart' '*.freezed.dart'
      - run: flutter analyze --no-fatal-infos
      - run: dart run tool/dead_code_check.dart
      # The per-user Linux installer verifies signatures and writes into $HOME.
      - run: ./tool/linux_install_test.sh
      - run: shellcheck linux/install.sh

  # Generated code is committed, so shards skip build_runner.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # The sqlite3 package's build hook downloads a prebuilt library on every
      # run; a cached copy avoids refetching it, including on GitHub outages.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build
          key: sqlite3-hook-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            sqlite3-hook-${{ runner.os }}-${{ github.job }}-

      - run: ./tool/bootstrap.sh
      # No secrets: the Last.fm key comes from optional --dart-define values,
      # and builds without one fall back to a user-supplied key.
      # flutter test can exit 0 after a runner shutdown crash (#32); the
      # shared guard fails the shard on a failure count or crash text.
      - shell: bash
        run: |
          source tool/lib/check_test_log.sh
          flutter test --total-shards 4 --shard-index ${{ matrix.shard }} 2>&1 | tee "$RUNNER_TEMP/test.log"
          assert_no_test_failures "$RUNNER_TEMP/test.log"

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # The runner image ships the SDK with licenses accepted; setup-android's
      # cmdline-tools 22 license step fails non-interactively.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-37.0' > /dev/null
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      # The sqlite3 package's build hook downloads a prebuilt library on every
      # run; a cached copy avoids refetching it, including on GitHub outages.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build
          key: sqlite3-hook-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            sqlite3-hook-${{ runner.os }}-${{ github.job }}-
      - run: flutter precache --android
      - run: ./tool/bootstrap.sh
      - run: ./tool/equalizer_native_test.sh
      - run: ./tool/android_repeat_runner_test.sh
      - run: ./tool/android_repeat_native_test.sh

  # The macOS-hosted job (id `ios` is required by the `ci` aggregate). Proves
  # the iOS project compiles (Swift plugins, the vendored just_audio Darwin
  # code and the equalizer tap; the simulator slice needs no signing and is
  # what the simulator runtime loop uses) and runs the tests that need a Mac:
  # the macOS runner XCTests, the macOS-only Dart tests and the libmpv fetch
  # script test. The repository is public, so macOS minutes are free. The iOS
  # project uses SwiftPM only; the macOS runner needs CocoaPods (preinstalled).
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build
          key: sqlite3-hook-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            sqlite3-hook-${{ runner.os }}-${{ github.job }}-
      - run: ./tool/bootstrap.sh
      # The pitch stage test also runs in the Linux native job; here the real
      # AUNewTimePitch test runs too (macOS only), without the Java part.
      - run: NAVIS_NATIVE_C_ONLY=1 ./tool/equalizer_native_test.sh
      - run: flutter build ios --simulator --debug
      # Targeted files only: the full suite has macOS-local failures and
      # golden diffs. This file's "running new app without a marker" test is
      # skipped everywhere but macOS.
      - run: flutter test test/src/features/settings/data/macos_update_test.dart
      - run: ./tool/libmpv_fetch_macos_test.sh
      # --config-only writes macos/Flutter/ephemeral and runs pod install; the
      # test then builds the Runner as the XCTest host (ad-hoc signed).
      - run: flutter build macos --debug --config-only
      - run: >-
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/macos-test
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES

  # One stable name to require in branch protection.
  ci:
    needs: [static, test, tooling, native, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.static.result }}" = success && test "${{ needs.test.result }}" = success && test "${{ needs.tooling.result }}" = success && test "${{ needs.native.result }}" = success && test "${{ needs.ios.result }}" = success
