flutter_launcher_icons:
  # Android — standard + adaptive (API 26+)
  android: true
  image_path_android: "lib/src/icon/Navis_App_Icon.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "lib/src/icon/Navis_Icon_light.png"
  min_sdk_android: 21

  # iOS
  ios: true
  image_path_ios: "lib/src/icon/Navis_Icon_Dark.png"
  remove_alpha_ios: true

  # macOS — generates all sizes in macos/Runner/Assets.xcassets/AppIcon.appiconset/
  macos:
    generate: true
    image_path: "lib/src/icon/Navis_Icon_Dark.png"

  # Windows — generates windows/runner/resources/app_icon.ico
  windows:
    generate: true
    image_path: "lib/src/icon/Navis_App_Icon.png"
    icon_size: 256
