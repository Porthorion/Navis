<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private session bus for nested-compositor runs (tool/lib/diagnostics.sh, tool/playback_harness.py).
     No <standard_session_servicedirs/>: nothing is ever activated from the user's service files, so no service can start
     with a path to the user's real session. Services the test needs are started by hand inside the bus. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
