# http context (NPMplus: data/custom_nginx/http.conf).
limit_req_zone $binary_remote_addr zone=demo:10m rate=20r/s;

# Concurrent-connection cap only for the long-lived methods (stream, download,
# transcoded stream), so album grids loading many covers in parallel are not hit.
# An empty key is not counted.
map $uri $demo_conn_key {
    default "";
    ~*^/demo/rest/(stream|download|getTranscodeStream)(\.view)?/?$ $binary_remote_addr;
}
limit_conn_zone $demo_conn_key zone=democonn:10m;
