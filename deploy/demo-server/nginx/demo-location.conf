# Paste into the proxy host's Advanced config (server level).
# Needs nginx/http-zone.conf in the http context. Replace 127.0.0.1:4535 with
# the host/port of the demo container if the proxy runs elsewhere.

# Only the Subsonic API is public. Blocked methods first (regex beats prefix).
location ~* ^/demo/rest/(changePassword|createUser|updateUser|deleteUser|createShare|updateShare|deleteShare|getShares|createInternetRadioStation|updateInternetRadioStation|deleteInternetRadioStation|jukeboxControl)(\.view)?/?$ {
    access_log off;
    return 403;
}

location /demo/rest/ {
    access_log off;
    # ~60 covers load at once in an album grid; 20r/s sustained.
    limit_req zone=demo burst=200 nodelay;
    proxy_pass http://127.0.0.1:4535;   # no URI part: path and query pass through
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;                # stream audio, Range passes through
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Everything else under /demo (web UI, /auth, /api, /share, ping...) is a 404.
location /demo {
    access_log off;
    return 404;
}
