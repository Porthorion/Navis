org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# Flutter 3.47.5 still uses legacy variant APIs. Remove this opt-out once the
# stable Flutter Gradle plugin supports AGP's new DSL (before moving to AGP 10).
android.newDsl=false
# Keep universal and per-ABI APKs mutually updatable at the same build number.
force-version-code-ignoring-abi=true
